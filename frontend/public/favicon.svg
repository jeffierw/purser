  <path d="M12.5 9 C13.5 10.2 14.5 10.8 16 10.8 C17.5 10.8 18.5 10.2 19.5 9 L20.2 10.5 C18.8 11.6 17.5 12 16 12 C14.5 12 13.2 11.6 11.8 10.5 Z" fill="#B88628" />

  <!-- Cinched rope knot band -->
  <rect x="12" y="11.2" width="8" height="2.2" rx="1.1" fill="#E2BD68" stroke="#8E6516" stroke-width="0.5" />
  <line x1="14.2" y1="11.2" x2="13.8" y2="13.4" stroke="#8E6516" stroke-width="0.5" />
  <line x1="16" y1="11.2" x2="15.8" y2="13.4" stroke="#8E6516" stroke-width="0.5" />
  <line x1="17.8" y1="11.2" x2="17.6" y2="13.4" stroke="#8E6516" stroke-width="0.5" />

  <!-- Coin purse main body (brass) -->
  <path d="M12.2 13 C9.5 14 7.5 17 7.5 21 C7.5 24.5 10.5 26.5 16 26.5 C21.5 26.5 24.5 24.5 24.5 21 C24.5 17 22.5 14 19.8 13 C18.5 14.2 13.5 14.2 12.2 13 Z" fill="#C59333" stroke="#8A6316" stroke-width="0.6" />

  <!-- Brass highlight & fold shadow -->
  <path d="M16 13.8 C18.2 15 22 17.8 22.2 21 C22.2 23.5 20 25.2 16 25.4" fill="none" stroke="#DDB357" stroke-width="0.8" stroke-linecap="round" />
  <path d="M10 21 C10 18 11.5 15.5 13 14" fill="none" stroke="#8A6316" stroke-width="0.6" opacity="0.6" />

  <!-- Small unbroken sealing-wax red seal on the lower right flank -->
